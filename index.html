<style>

<style>
/* Una sola columna de trabajo, como una libreta de pruebas: pasos en orden, sin códigos. */
:root{
  --bg:#F6F1E7; --card:#FFFDF8; --ink:#2B2B2B; --muted:#5E5A52; --line:#DED3BF; --kraft:#C8A27A;
  --felt:#2F4A3A; --felt-ink:#FFFFFF; --hacen:#2E5C8A; --hacen-t:#DDE7F1; --dicen:#8A6A10; --dicen-b:#E0B33A; --dicen-t:#F7EBC4;
  --alert:#B5432F; --alert-t:#F8E6E1; --ok:#2E6B43; --ok-t:#E1EFE5; --chip:#EFE7D8;
  --f-display:'Bitter',Georgia,serif; --f-body:'Atkinson Hyperlegible',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);color:var(--felt);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.02em}
.kick{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;padding-top:4px}
.top svg{width:52px;height:auto;color:var(--felt);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tight{gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
button,.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:48px;cursor:pointer;text-align:center}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--hacen);outline-offset:2px}
button.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--felt);padding-inline:4px;min-height:40px}
button.danger{color:var(--alert);border-color:var(--alert)}
button:disabled{opacity:.45;cursor:not-allowed}
button.full{width:100%}
label{font-weight:700;font-size:.92rem}
.hint{font-size:.85rem;color:var(--muted);font-weight:400}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:76px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.banner{border-radius:10px;padding:12px 14px;font-size:.92rem;border:1px solid var(--line);background:var(--chip)}
.banner.warn{background:var(--alert-t);border-color:var(--alert);color:var(--ink)}
.banner.good{background:var(--ok-t);border-color:var(--ok)}
.banner b{color:inherit}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.new{background:var(--dicen-t);color:var(--dicen)} .chip.sus{background:var(--ok-t);color:var(--ok)} .chip.ex{background:var(--hacen-t);color:var(--hacen)}
.chipbtn{min-height:36px;padding:6px 12px;border-radius:999px;font-size:.88rem;font-weight:700;background:var(--chip);border:1px solid var(--line)}
.protocard{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;font-weight:400}
.protocard h3{margin-bottom:2px}
/* pasos */
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.steps span{flex:1 0 auto;font-size:.74rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-radius:6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.steps span.on{background:var(--felt);color:var(--felt-ink)} .steps span.done{color:var(--ink)}
/* elección */
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font-weight:400;width:100%}
.opt[aria-pressed="true"]{border-color:var(--felt);box-shadow:inset 0 0 0 1px var(--felt);background:var(--ok-t)}
.opt .tick{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--felt)}
.opt[aria-pressed="true"] .tick{border-color:var(--felt);background:var(--felt);color:var(--felt-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:52px;padding:8px 12px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
.verbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verbs button{text-align:left;font-weight:400;display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.verbs button b{font-family:var(--f-display);color:var(--felt);font-size:1rem}
.verbs button[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.verbs button[aria-pressed="true"] b{color:var(--felt-ink)}
.verbs .wide{grid-column:1 / -1}
/* rejilla de marcas */
.gridwrap{overflow-x:auto}
.grid{display:grid;gap:6px;align-items:center;min-width:0}
.rlab{font-weight:700;font-size:.85rem;border-radius:8px;padding:8px 8px;line-height:1.1}
.rlab small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.rlab.h{background:var(--hacen-t);color:var(--hacen);border-left:4px solid var(--hacen)}
.rlab.d{background:var(--dicen-t);color:var(--dicen);border-left:4px solid var(--dicen-b)}
.jh{text-align:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.mk{min-height:52px;min-width:44px;padding:0;font-size:1.5rem;line-height:1;font-weight:700;border-radius:8px;border:2px solid var(--line);background:var(--bg)}
.mk.ok{color:var(--ok);border-color:var(--ok)} .mk.falla{color:var(--alert);border-color:var(--alert)} .mk.na{color:var(--muted);border-color:var(--muted)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.photo{border-radius:10px;border:1px solid var(--line);overflow:auto;max-height:60vh;background:var(--chip)}
.photo img{display:block;width:100%;height:auto;max-width:none;cursor:zoom-in}
.photo.zoom img{width:200%;cursor:zoom-out}
/* cruce */
.res{display:flex;flex-direction:column;gap:10px}
.line2{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tag{font-size:.72rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag.h{background:var(--hacen-t);color:var(--hacen)} .tag.d{background:var(--dicen-t);color:var(--dicen)}
.case{border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.case.strong{border-color:var(--felt);background:var(--ok-t)}
.case b{font-family:var(--f-display);color:var(--felt)}
.sealed{border:1px dashed var(--kraft);border-radius:10px;padding:12px;background:var(--chip)}
.counts{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--felt);color:var(--felt-ink);padding:12px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20}
.hist{display:flex;flex-direction:column;gap:8px}
.hist button{text-align:left;font-weight:400;display:flex;flex-direction:column;gap:6px;width:100%}
.map dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 12px;margin:0}
.map dt{font-weight:700} .map dd{margin:0;color:var(--muted);overflow-wrap:anywhere}
.qbox{background:var(--dicen-t);border-left:4px solid var(--dicen-b);border-radius:8px;padding:10px 12px}
ol,ul{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.err{color:var(--alert);font-size:.88rem;font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.vh:focus-visible + *, label.btn:has(+ .vh:focus-visible){outline:3px solid var(--hacen);outline-offset:2px}
label.btn{display:block;font-size:1rem}
.warnmsg{color:var(--dicen);font-size:.88rem;font-weight:700}
@media (max-width:420px){.verbs{grid-template-columns:1fr} .map dl{grid-template-columns:1fr} h1{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* App v2: definición de mecánicas, partida en dos mitades, opiniones por jugador. */
.split{display:flex;flex-direction:column;gap:10px;height:calc(100dvh - 140px);min-height:420px;scroll-margin-top:calc(8px + env(safe-area-inset-top,0px))}
.half{flex:1 1 0;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px 10px}
.halfh{position:sticky;top:0;background:var(--card);z-index:3;padding:8px 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.halfh .kick{color:var(--felt)}
.pgrid{display:grid;gap:6px;align-items:center}
.pgrid .jh{position:sticky;top:30px;background:var(--card);z-index:2;padding:2px 0}
.grp{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--felt);padding-top:8px;border-top:1px solid var(--line)}
.vlab{font-weight:700;font-size:.86rem;line-height:1.15;padding:6px 8px;border-radius:8px;background:var(--hacen-t);color:var(--hacen);border-left:4px solid var(--hacen);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:help;min-width:0;overflow-wrap:anywhere}
.vlab.d{background:var(--dicen-t);color:var(--dicen);border-left-color:var(--dicen-b)}
.vlab small{display:block;font-weight:400;font-size:.7rem;opacity:.85}
.notes{display:flex;flex-direction:column;gap:10px}
.notes textarea{min-height:52px}
.holdpop{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;background:var(--felt);color:var(--felt-ink);border-radius:12px;padding:14px 16px;z-index:30;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px}
.holdpop[hidden]{display:none}
.holdpop .kick{color:inherit;opacity:.85}
.oprow{display:grid;grid-template-columns:34px 52px minmax(0,1fr);gap:8px;align-items:center}
.mec{display:flex;flex-direction:column;gap:12px}
.comp{border-left:3px solid var(--kraft);padding-left:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.var{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.var.rev{border-color:var(--alert)}
.sug{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sug > span{min-width:0}
.status{font-size:.78rem;font-weight:700;font-family:var(--f-mono);letter-spacing:.03em}
.status.ok{color:var(--ok)} .status.rev{color:var(--alert)}
.tree{display:flex;flex-direction:column;gap:4px;margin:0;padding-left:1rem}
.oplist{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.pgrid .mk{min-height:44px;font-size:1.3rem}
.oprow .mk{min-height:44px;font-size:1.3rem}
</style>

<style>
/* Piel del kit de fantasía medieval: pergamino, latón y hierro. Los marcos son imágenes de 9 cortes
   (esquinas fijas, bordes que se estiran) exportadas desde Affinity a 3×. Un solo tema claro, a propósito. */
:root{ color-scheme:light;
  --bg:#EFDDC2; --card:#F6EAD6; --ink:#2B2320; --muted:#6B5A48; --line:#C9B08A; --kraft:#B8925A;
  --felt:#3A3430; --felt-ink:#F3E3C9; --head:#4A3424;
  --hacen:#2E5C8A; --hacen-t:#DCE3EA; --dicen:#7A5C0E; --dicen-b:#C99E2A; --dicen-t:#F1E2B8;
  --alert:#8C2A28; --alert-t:#F2D9D2; --ok:#2E6B43; --ok-t:#E3EBD8; --chip:#EADBC0; }
body{background:var(--bg) url(img/fondo-app-claro.png) repeat;background-size:256px 256px}
h1,h2,h3{color:var(--head)}
h1::after{content:"";display:block;width:180px;max-width:100%;height:9px;margin-top:8px;background:url(img/adorno-divisor.png) left center/180px 9px no-repeat}
#app::after{content:"";display:block;aspect-ratio:1280/192;margin-top:8px;background:url(img/ilu-pie-pagina.png) center bottom/100% auto no-repeat}
.top svg{color:var(--head)}
/* marcos */
.card{border:20px solid transparent;border-image:url(img/marco-tarjeta.png) 72 fill / 20px stretch;border-radius:0;background:none;padding:6px 8px}
.card.opt[aria-pressed="true"],button.card[aria-pressed="true"]{border-image-source:url(img/marco-tarjeta-activa.png);background:none;box-shadow:none}
button.card{color:var(--ink)}
button.card:active{border-image-source:url(img/marco-tarjeta-activa.png)}
.sealed{border:18px solid transparent;border-image:url(img/marco-sellado.png) 72 fill / 18px stretch;border-radius:0;background:none;padding:6px 8px 4px 22px}
.banner{border:16px solid transparent;border-image:url(img/marco-campo.png) 72 fill / 16px stretch;border-radius:0;background:none;padding:2px 6px}
.banner.warn{border-image-source:url(img/marco-aviso.png);background:none;padding-left:12px}
.half{border:22px solid transparent;border-image:url(img/marco-mitad.png) 72 fill / 22px stretch;border-radius:0;background:none;padding:0 4px 4px}
.halfh,.pgrid .jh{background:#F1DFC2}
.var{border:14px solid transparent;border-image:url(img/marco-campo.png) 72 fill / 14px stretch;border-radius:0;background:none;padding:4px 6px}
.var.rev{border-image-source:url(img/marco-aviso.png)}
.holdpop{border:18px solid transparent;border-image:url(img/marco-popup.png) 72 fill / 18px stretch;border-radius:0;background:none;box-shadow:none;padding:6px 8px;color:var(--felt-ink)}
.holdpop::before{content:"";position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:48px;height:21px;background:url(img/adorno-rombo-superior.png) center/contain no-repeat}
.toast{border:14px solid transparent;border-image:url(img/marco-popup.png) 72 fill / 14px stretch;border-radius:0;background:none;padding:2px 6px}
input[type=text],input[type=number],textarea,select{border:10px solid transparent;border-image:url(img/marco-campo.png) 72 fill / 10px stretch;border-radius:0;background:none;padding:4px 6px}
.case{background:rgba(255,250,240,.5);border-color:var(--line)}
.case.strong{background:var(--ok-t);border-color:var(--ok)}
.qbox{background:var(--dicen-t)}
.comp{border-left-color:var(--kraft)}
/* títulos de sección con la cabecera de lista del kit */
section.stack > h2{border-style:solid;border-color:transparent;border-width:0 20px 0 48px;border-image:url(img/cabecera-lista.png) 0 60 0 144 fill / 0 20px 0 48px stretch;color:var(--felt-ink);min-height:40px;display:flex;align-items:center;font-size:1.05rem;letter-spacing:.02em}
/* botones: placas con bisel; el centro se estira a lo ancho */
button,.btn{border-style:solid;border-color:transparent;border-width:0 16px;border-image:url(img/boton-secundario.png) 0 48 fill / 0 16px stretch;border-radius:0;background:none;padding:12px 4px 14px;color:var(--ink)}
button:active:not(:disabled),.btn:active{border-image-source:url(img/boton-secundario-presionado.png)}
button.primary{border-image-source:url(img/boton-principal.png);background:none;color:var(--felt-ink)}
button.primary:active:not(:disabled){border-image-source:url(img/boton-principal-presionado.png)}
button.primary:disabled{border-image-source:url(img/boton-principal-inactivo.png);color:var(--muted);opacity:1}
button.danger{border-image-source:url(img/boton-peligro.png);color:#F6E3D8}
button.ghost{border-image:none;border-width:0;padding-inline:4px;color:var(--head)}
button:disabled{opacity:.6}
.chipbtn,.seg button{border-width:0 12px;border-image:url(img/boton-chip.png) 0 54 fill / 0 12px stretch;padding:6px 2px;min-height:36px;border-radius:0}
.seg button{min-height:44px;padding:8px 4px}
.seg button[aria-pressed="true"],.chipbtn:active{border-image-source:url(img/boton-chip-activo.png);background:none;color:var(--felt-ink)}
.verbs button{border-image-source:url(img/boton-secundario.png);flex-direction:row;align-items:center;gap:8px;padding:10px 4px 12px}
.verbs button[aria-pressed="true"]{border-image-source:url(img/boton-principal.png);background:none}
.verbs button b{color:var(--head)} .verbs button[aria-pressed="true"] b{color:var(--felt-ink)}
.vtx{display:flex;flex-direction:column;gap:2px;min-width:0}
/* pestañas de pasos */
.steps{gap:6px}
.steps span{display:inline-flex;align-items:center;gap:6px;border-style:solid;border-color:transparent;border-width:0 10px;border-image:url(img/pestana-paso.png) 0 30 fill / 0 10px stretch;border-radius:0;background:none;padding:5px 2px}
.steps span.on{border-image-source:url(img/pestana-paso-actual.png);background:none;color:var(--felt-ink)}
.steps span.done{border-image-source:url(img/pestana-paso-hecho.png);color:var(--ink)}
.steps span[role=button]{cursor:pointer}
/* casillas y símbolos */
.mk{border:12px solid transparent;border-image:url(img/casilla-marca.png) 36 fill / 12px stretch;border-radius:0;background:none;padding:0;display:grid;place-items:center}
.mk:active{border-image-source:url(img/casilla-marca-presionada.png)}
.mk.ok,.mk.falla,.mk.na{border-color:transparent}
.sim{width:26px;height:26px;display:block}
.sim-s{width:16px;height:16px;vertical-align:-3px}
/* íconos */
.ico-s{width:18px;height:18px;flex:none}
.ico-m{width:40px;height:40px;flex:none}
.ico-b{width:28px;height:28px;flex:none}
.ico-v{width:32px;height:32px;flex:none}
.con-ico{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.sug{flex-wrap:nowrap}
.sug .sugtx{flex:1;min-width:0}
.sug > .row{flex:none}
@media (max-width:420px){.sug{flex-wrap:wrap}.sug > .row{width:100%;justify-content:flex-end}}

<div id="app"><p class="muted">Cargando…</p></div>

<script src="jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* ---------------- Datos fijos ---------------- */
/* Sugeridas: lo que casi todo juego tiene. Cada una trae un preset de componentes y variables; la intención la escribe el creador. */
const SUG = [
  {k:'jugadores', n:'Jugadores', h:'Cuántos juegan y cómo se relacionan', comps:[
    {n:'Interacción en la mesa', vars:[['Esperan su turno sin mirar el celular','nadie espera su turno mirando el celular'],['Interactúan con los demás','cada jugador hace al menos una jugada que afecta a otro']]}]},
  {k:'tiempo', n:'Tiempo de partida', h:'¿Cuánto dura una partida?', comps:[
    {n:'Duración', vars:[['Nadie pregunta cuánto falta','nadie pregunta cuánto falta antes del final'],['Termina en el tiempo previsto','la partida termina antes del minuto previsto']]}]},
  {k:'espacio', n:'Espacio de juego', h:'Tablero, zonas en la mesa, mazos…', comps:[
    {n:'Tablero y zonas', vars:[['Encuentran dónde va cada pieza','nadie busca dónde va una pieza'],['Alcanzan todo desde su puesto','nadie se levanta ni se estira para alcanzar algo']]}]},
  {k:'turnos', n:'Turnos', h:'¿Cuántos hay y cómo pasa uno al otro?', comps:[
    {n:'Orden de turno', vars:[['Saben a quién le toca','nadie pregunta a quién le toca'],['Cierran su turno sin ayuda','terminan su turno sin que otro les explique qué falta']]},
    {n:'Acciones por turno', vars:[['Usan todas sus acciones','usan todas las acciones de su turno'],['Releen la regla','no releen la regla de las acciones durante su turno']]}]},
  {k:'victoria', n:'Condición de victoria', h:'Puntos, eliminación, una meta…', comps:[
    {n:'Final de la partida', vars:[['Ganador abierto a mitad de partida','a la mitad de la partida todavía no hay un ganador definido'],['Todos compiten al final','cerca del final, todos siguen intentando ganar']]}]},
  {k:'puntaje', n:'Puntaje', h:'Cómo se ganan los puntos', comps:[
    {n:'Combos', vars:[['Cantidad de combos','a la mitad de la partida nadie se dispara ni queda tan atrás que no pueda alcanzar a los demás'],['Combos similares','arman combos del mismo tipo sin que uno solo decida la partida'],['Combos especiales','el combo especial aparece pocas veces y no define solo al ganador'],['Grupos de combos','nadie acumula varios combos en un turno que lo deje sin rival']]}]},
];
const VERBS = [
  {k:'quitar', n:'Quitar', d:'Falla en la mayoría y no aporta al juego.', change:true},
  {k:'ajustar', n:'Ajustar', d:'Falla, pero vale la pena: le cambias el valor.', change:true},
  {k:'mantener', n:'Mantener', d:'Cumple y sostiene el juego.', change:false},
  {k:'potenciar', n:'Potenciar', d:'Es lo que más disfrutan: le das más espacio.', change:true},
  {k:'observar', n:'Volver a observar', d:'La señal es débil o depende de otra variable.', change:false, wide:true},
];
const JS = ['J1','J2','J3','J4'];  /* máximo 4 jugadores */
const SYM = {ok:'✓', falla:'✗', na:'—'};
const LAB = {ok:'positivo', falla:'negativo', na:'neutro'};
const NEXT = {'':'ok', ok:'falla', falla:'na', na:''};
/* Flujo del diagrama de uso: antes de jugar → partida → opiniones → resultados → decisión. */
const STEPS = [['preparar','Antes de jugar','1'],['partida','Partida','2'],['opiniones','Opiniones','3'],['cruce','Resultados','4'],['decision','Decisión','5']];
const VERBOS = ['cogen','preguntan','esperan','juegan','miran el celular','negocian','ponen','terminan','dudan','se quejan','releen'];
const OPINION = /(gust|divert|diviert|bonit|chever|entreten|agradab|disfrut|que les parezca|que sientan|que les encante|interes)/i;
const CUENTA = /(\brondas?\b|\bveces\b|\bsiempre\b|\bnunca\b|\bcada\b|\bpromedio\b|\bcantidad\b)/i;
const LIM = {mecAviso:2, varAviso:7, comps:3, vars:5, varsTotal:12};
const PERMISO = '«Estoy probando un juego que todavía está en desarrollo. Mientras juegan voy a marcar lo que pasa en la partida, y al final les haré unas preguntas cortas. No grabo audio ni video, no tomo fotos de personas y no anoto sus nombres: cada uno será el número de su puesto en la mesa. Lo que anote se usa solo para mejorar el juego. Participar es voluntario y pueden retirarse cuando quieran. ¿Aceptan?»';

/* ---------------- Estado ---------------- */
const S = {db:null, col:null, uid:null, assets:null, downloads:null, ready:false, mode:'memoria',
  protos:{}, view:{name:'home'}, d:{}, toast:'', photoUrl:{}, blobUrl:{}, blobWait:{}, confirmDel:null};
const writing = {};

/* ---------------- Utilidades ---------------- */
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => new Date().toISOString();
const fdate = iso => { try { return new Date(iso).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return ''; } };
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(()=>{ S.toast=''; render(); }, 3200); }

/* ---------------- Modelo: mecánica > componente > variable ---------------- */
function emptyProto(name, lugar){
  return {id: uid('m_'), kind:'proto', schema:2, name, lugar: lugar||'', created: now(), updated: now(), version: 1,
    mecanicas:[], sessions:[], siguiente:'', sorpresas:[]};
}
const newVar = (n, ej) => ({id:uid('v'), nombre:n||'', valor:'', intencion:'', ej:ej||'', propia:false});
const newComp = (n, vars) => ({id:uid('c'), nombre:n||'', abierto:true, variables: vars || [newVar()]});
const newMec = (n, sug) => ({id:uid('k'), nombre:n||'', sug:sug||'', intencion:'', incluir:true, siguiente:'', componentes:[]});
function fromSug(sg, preset){
  const m = newMec(sg.n, sg.k);
  if (preset) m.componentes = sg.comps.map(c => newComp(c.n, c.vars.map(([n,ej]) => newVar(n, ej))));
  return m;
}
const named = v => v && (v.nombre||'').trim();
function mecVars(m){ const out = []; (m.componentes||[]).forEach(c => (c.variables||[]).forEach(v => { if (named(v)) out.push({m, c, v}); })); return out; }
function findVar(p, id){ for (const m of p.mecanicas) for (const c of m.componentes) for (const v of c.variables) if (v.id === id) return {m, c, v}; return null; }
function hasMap(p){ return p.mecanicas.some(m => (m.nombre||'').trim()); }
function openSession(p){ return p.sessions.find(s => s.tipo === 'prueba' && s.estado !== 'cerrada'); }
function pruebas(p){ return p.sessions.filter(s => s.tipo === 'prueba'); }
function selMecs(p, s){ return p.mecanicas.filter(m => (s.mecs||[]).includes(m.id)); }
function selVars(p, s){ return selMecs(p, s).flatMap(mecVars); }
function question(v){ return `«Cuéntame un momento de la partida relacionado con “${v.nombre}”. ¿Qué pasó?»`; }

/* ---------------- Validación de la intención previa ---------------- */
function critCheck(t){
  t = (t||'').trim();
  if (t.length < 8) return {err:'Escribe la intención previa: qué debe verse en la mesa si funciona.'};
  if (OPINION.test(t)) return {err:'Eso es una opinión y no se ve en la mesa. Escribe una conducta concreta: qué harían los jugadores si funciona.'};
  if (CUENTA.test(t)) return {warn:'Si hay que contar o recordar toda la partida, di en qué momento lo miras (por ejemplo, a la mitad o al final de cada ronda).'};
  return {};
}
function varCheck(v){ if (!named(v)) return {err:'Ponle nombre a la variable.'}; return critCheck(v.intencion); }

/* ---------------- Cruce (lógica pura) ---------------- */
/* ok = positivo, falla = negativo, na = neutro, vacío = no se vio. */
function cruce(marks, nj){
  const js = JS.slice(0, nj || 4);
  const h = {ok:[],falla:[],na:[],vacio:[]}, d = {ok:[],falla:[],na:[],vacio:[]};
  const cases = {vieron_dicen:[], hacen_dicen_bien:[], dicen_no_vio:[], funciona:[]};
  js.forEach(j => {
    const hv = (marks.hacen||{})[j] || '', dv = (marks.dicen||{})[j] || '';
    (h[hv] || h.vacio).push(j); (d[dv] || d.vacio).push(j);
    if ((hv==='ok'||hv==='falla') && (dv==='ok'||dv==='falla')) {
      const k = hv==='falla' ? (dv==='falla' ? 'vieron_dicen' : 'hacen_dicen_bien') : (dv==='falla' ? 'dicen_no_vio' : 'funciona');
      cases[k].push(j);
    }
  });
  /* Conducta primero: la señal es firme cuando 2 o más coinciden en lo que HACEN; lo que dicen la matiza. */
  let main = null, firme = false;
  if (h.falla.length >= 2) { firme = true; main = cases.vieron_dicen.length >= 2 ? 'vieron_dicen' : cases.hacen_dicen_bien.length >= 2 ? 'hacen_dicen_bien' : 'falla_mesa'; }
  else if (h.ok.length >= 2) { firme = true; main = cases.dicen_no_vio.length >= 2 ? 'dicen_no_vio' : cases.funciona.length >= 2 ? 'funciona' : 'funciona_mesa'; }
  else main = CASES4.find(k => cases[k].length) || null;
  return {js, h, d, cases, main, firme, falla: h.falla.length >= 2, total: js.length};
}
const CASE_TXT = {
  vieron_dicen: ['Lo vieron y lo dicen','El candidato más sólido para cambiar.'],
  hacen_dicen_bien: ['Lo hacen, pero dicen que está bien','La conducta pesa más que la palabra.'],
  dicen_no_vio: ['Lo dicen, pero no se vio','Revisa si estabas mirando lo correcto.'],
  funciona: ['Funciona','No se toca: es evidencia de lo que ya sirve.'],
  falla_mesa: ['Negativo en la mesa','2 o más jugadores, aunque no todos lo cuentan igual. La conducta pesa más que la palabra.'],
  funciona_mesa: ['Positivo en la mesa','2 o más jugadores; lo que dicen se divide.'],
};
const CASES4 = ['vieron_dicen','hacen_dicen_bien','dicen_no_vio','funciona'];
const listJ = a => a.length ? a.join(', ') : '';
function sustentada(sess, vid){
  const dec = (sess.decisiones||{})[vid]; if (!dec || !dec.verbo || dec.verbo === 'observar') return false;
  return cruce((sess.marcas||{})[vid]||{}, sess.jugadores).firme;
}

/* ---------------- Guardado en este dispositivo ----------------
   Los prototipos viven en el almacenamiento local del navegador y las fotos en su base de datos
   de archivos. Nada sale del dispositivo: sin cuenta, sin servidor y sin internet. */
const CLAVE = 'ice.v3.';
function persist(p){
  if (p.example) return Promise.resolve();
  p.updated = now(); S.protos[p.id] = p;
  try { localStorage.setItem(CLAVE + p.id, JSON.stringify(p)); }
  catch(e) { toast('No hay espacio para guardar más datos en este dispositivo. Borra algún prototipo o alguna foto.'); }
  return Promise.resolve();
}
function removeProto(p){
  delete S.protos[p.id];
  try { localStorage.removeItem(CLAVE + p.id); } catch(e) {}
  (p.sessions||[]).forEach(s => (s.fotos||[]).forEach(fotoDel));
}
/* Fotos: base de datos del navegador, porque no caben en el almacenamiento de texto. */
let _fdb = null;
function fdb(){
  return _fdb || (_fdb = new Promise((res, rej) => {
    const r = indexedDB.open('ice-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }).catch(e => { _fdb = null; throw e; }));
}
async function fotoPut(id, blob){ const db = await fdb(); return new Promise((res, rej) => { const t = db.transaction('f','readwrite'); t.objectStore('f').put(blob, id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function fotoGet(id){ const db = await fdb(); return new Promise((res, rej) => { const t = db.transaction('f','readonly'); const q = t.objectStore('f').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
function fotoDel(id){ fdb().then(db => db.transaction('f','readwrite').objectStore('f').delete(id)).catch(()=>{}); }
/* Devuelve la dirección de una foto guardada; la primera vez la carga y vuelve a dibujar. */
function fotoUrl(id){
  if (S.blobUrl[id]) return S.blobUrl[id];
  if (!S.blobWait[id]) { S.blobWait[id] = 1; fotoGet(id).then(b => { if (b) { S.blobUrl[id] = URL.createObjectURL(b); render(); } }).catch(()=>{}); }
  return '';
}
function fotoBox(s, alt){
  const u = S.photoUrl[s.id] || ((s.fotos||[]).length ? fotoUrl(s.fotos[s.fotos.length-1]) : '');
  return u ? `<div class="photo"><img src="${u}" alt="${alt}" data-act="zoom"></div>` : '';
}

/* ---------------- Ejemplo resuelto ---------------- */
function exampleProto(){
  const p = emptyProto('Cartas de animales', 'Ejemplo');
  p.id = 'ejemplo'; p.example = true; p.version = 2;
  const m = newMec('Turnos', 'turnos'); m.intencion = 'casi todos juegan algo en su turno, también cerca del final';
  const v1 = Object.assign(newVar('Cogen algo en su turno'), {id:'ev1', valor:'3', intencion:'casi todos cogen algo en su turno, también cerca del final'});
  const v2 = Object.assign(newVar('Esperan sin mirar el celular'), {id:'ev2', valor:'3', intencion:'nadie espera su turno mirando el celular'});
  const c = newComp('Cartas que se destapan por turno', [v1, v2]); m.componentes = [c]; p.mecanicas = [m];
  p.sessions = [{id:'e1', tipo:'prueba', version:1, n:1, fecha:'2026-10-21T15:00:00Z', estado:'cerrada', jugadores:4, juega:false, modo:'app',
    intencion:{probar:'Si el final se hace lento', cambiar:'Cuántas cartas se destapan'}, mecs:[m.id],
    vars:[{id:'ev1', mcode:'M1', ccode:'C1', mec:'Turnos', comp:c.nombre, nombre:v1.nombre, valor:'2: una en secreto y una a la vista', intencion:v1.intencion},
          {id:'ev2', mcode:'M1', ccode:'C1', mec:'Turnos', comp:c.nombre, nombre:v2.nombre, valor:'2', intencion:v2.intencion}],
    marcas:{ev1:{hacen:{J1:'falla',J2:'falla',J3:'ok',J4:'falla'}, dicen:{J1:'ok',J2:'falla',J3:'ok',J4:'na'}},
            ev2:{hacen:{J1:'ok',J2:'ok',J4:'ok'}, dicen:{J1:'ok',J2:'ok',J4:'ok'}}},
    nota:'M1·C1·V1: al final, J1 y J4 pasaron dos turnos seguidos sin coger nada.',
    opiniones:{ev1:{J1:'estuvo bien, normal', J2:'al final ya no había nada que coger', J3:'destapar fue lo mejor'}},
    decisiones:{ev1:{verbo:'ajustar', nuevoValor:'3', espera:'que casi todos cojan algo en su turno, también al final', porque:'3 de 4 pasaron turnos sin coger nada'}, ev2:{verbo:'mantener', nuevoValor:'', espera:'', porque:''}},
    eraLoQueCreia:true, sorpresa:'Todos celebran los animales mezclados', cerrada:'2026-10-21T16:10:00Z'}];
  return p;
}
const EXAMPLE = exampleProto();

function modeBanner(){
  if (!S.ready || S.mode === 'db') return '';

function render(){
  const a = document.activeElement, fid = a && a.id, sel = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  const keep = {}; $app.querySelectorAll('[data-keep]').forEach(el => { keep[el.dataset.keep] = el.scrollTop; });
  const v = S.view; let html = '';
  try {
    if (v.name === 'home') html = vHome();
    else if (v.name === 'proto') html = vProto(getProto(v.pid));
    else if (v.name === 'mecs') html = vMecs(getProto(v.pid));
    else if (v.name === 'instructivo') html = vInstructivo();
    else if (v.name === 'session') html = vSession(getProto(v.pid));
    else if (v.name === 'summary') html = vSummary(getProto(v.pid), v.sid);
  } catch(e) { console.error(e); html = `<div class="banner warn">Algo salió mal al mostrar esta pantalla. <button class="ghost" data-act="home">Volver al inicio</button></div>`; }
  if (S.toast) html += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  $app.innerHTML = html;
  Object.keys(keep).forEach(k => { const el = $app.querySelector(`[data-keep="${k}"]`); if (el) el.scrollTop = keep[k]; });
  const st = $app.querySelector('.steps'), on = st && st.querySelector('.on');
  if (on) st.scrollLeft = on.offsetLeft - st.offsetLeft - (st.clientWidth - on.offsetWidth) / 2;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({preventScroll:true}); if (sel && el.setSelectionRange) { try { el.setSelectionRange(sel[0], sel[1]); } catch(e){} } } }
}
/* En la partida en la app, la pantalla queda sobre las dos mitades; en lo demás, arriba. */

/* ---------- Inicio (P1 del diagrama: prototipos creados, nuevo prototipo, ejemplo → instructivo) ---------- */
function vHome(){
  const list = Object.values(S.protos).sort((a,b) => (b.updated||'').localeCompare(a.updated||''));
  const lugares = [...new Set(list.map(p => p.lugar).filter(Boolean))];
  const d = S.d.home || (S.d.home = {name:'', lugar:''});

    const o = openSession(p), n = pruebas(p).filter(s => s.estado==='cerrada').length;
    const next = !hasMap(p) ? 'Definir mecánicas' : o ? 'Seguir la prueba' : 'Nueva prueba';
    return `<button class="card protocard" data-act="open" data-pid="${p.id}"><span><h3>${esc(p.name)}</h3><span class="small muted">Versión ${p.version} · ${n} ${n===1?'prueba':'pruebas'}${p.lugar?' · '+esc(p.lugar):''}</span></span><span class="chip">${next}</span></button>`;

  return `${header()}${modeBanner()}
  ${S.instalable?`<div class="banner"><b>Instala la app en este dispositivo</b> para abrirla desde el inicio y usarla sin internet. <button class="chipbtn" data-act="instalar" style="margin-top:8px">Instalar</button></div>`:''}
  <section class="stack"><h2>Prototipos creados</h2><div class="rejilla">${cards}</div></section>
  <section class="card"><h3>Nuevo prototipo</h3>
    <div class="field"><label for="np-name">Nombre del juego</label><input id="np-name" type="text" data-bind="home.name" value="${esc(d.name)}" placeholder="Por ejemplo: Granja de prueba" autocomplete="off"></div>
    <div class="field"><label for="np-lugar">Lugar donde pruebas <span class="hint">(opcional)</span></label><input id="np-lugar" type="text" list="lugares" data-bind="home.lugar" value="${esc(d.lugar)}" placeholder="Por ejemplo: Tokyonation" autocomplete="off"><datalist id="lugares">${lugares.map(l=>`<option value="${esc(l)}">`).join('')}</datalist></div>
    <button class="primary" data-act="create" ${d.name.trim()?'':'disabled'}>Crear y definir mecánicas</button>

    <button class="card protocard" data-act="instructivo"><span><h3>Instructivo</h3><span class="small muted">Cómo se usa la app, paso a paso, con un ejemplo resuelto</span></span><span class="chip ex">Ver</span></button>
  </section>`;
}

/* ---------- Prototipo ---------- */
function mecTree(m, mi){
  return `<div class="tree-m"><div class="row" style="flex-wrap:nowrap">${ico(m.sug?'mec-'+m.sug:'mec-propia','ico-s')}<span class="cod m">M${mi+1}</span><b>${esc(m.nombre)}</b></div>
    ${m.intencion?`<span class="small muted">Intención previa: ${esc(m.intencion)}</span>`:''}
    ${(m.componentes||[]).filter(c => (c.nombre||'').trim()).map((c,ci)=>`<div class="tree-c"><span class="cod c">C${ci+1}</span><b class="small">${esc(c.nombre)}</b></div>${c.variables.filter(named).map((v,vi)=>`<div class="tree-v"><span class="cod v">V${vi+1}</span><span class="small">${esc(v.nombre)}</span></div>`).join('')}`).join('')}</div>`;
}
function vProto(p){
  if (!p) return `${header()}<div class="banner warn">No encontré ese prototipo.</div><button data-act="home">Volver</button>`;
  const o = openSession(p);
  const closed = pruebas(p).filter(s => s.estado === 'cerrada');
  let sus = 0, nuevas = 0;
  closed.forEach(s => { (s.vars||[]).forEach(v => { if (sustentada(s, v.id)) sus++; }); if (s.eraLoQueCreia === false) nuevas++; });
  let cta;
  if (p.example) cta = `<div class="banner">Este es un ejemplo: puedes abrir su prueba y ver los resultados, pero no se guarda nada.</div>`;
  else if (!hasMap(p)) cta = `<button class="primary full" data-act="editmap">Definir mecánicas</button>`;
  else if (o) cta = `<button class="primary full" data-act="resume" data-sid="${o.id}">Seguir la prueba · ${esc((STEPS.find(x=>x[0]===o.estado)||['','',''])[1])}</button>`;
  else cta = `<button class="primary full" data-act="editmap">Revisar mecánicas y probar</button>`;
  const rep = (p.sorpresas||[]).filter(x => x.veces >= 2 && !x.convertida);
  const repHtml = rep.length ? `<div class="banner"><b>Esto se ha repetido en tus pruebas.</b> Puede ser una mecánica para probar.<div class="stack" style="margin-top:8px">${rep.map(x=>`<div class="row between"><span>«${esc(x.texto)}» · ${x.veces} veces</span>${p.example?'':`<button class="chipbtn" data-act="sorp2mec" data-id="${x.id}">Volverla mecánica</button>`}</div>`).join('')}</div></div>` : '';
  const hist = [...p.sessions].filter(s => s.estado === 'cerrada' && s.tipo === 'prueba').reverse().map(s => {
    const vs = s.vars||[]; const ns = vs.filter(v => sustentada(s, v.id)).length;
    const cambios = vs.filter(v => { const d = (s.decisiones||{})[v.id]; const vb = VERBS.find(x => d && x.k === d.verbo); return vb && vb.change; }).length;
    return `<button class="card" data-act="summary" data-sid="${s.id}"><span class="row between"><b>Prueba ${s.n} · versión ${s.version}</b><span class="small muted">${fdate(s.fecha)}</span></span><span class="row"><span class="chip">${vs.length} variables</span><span class="chip">${cambios} ${cambios===1?'cambio':'cambios'}</span>${ns?`<span class="chip sus">${ns} sustentadas</span>`:''}${s.eraLoQueCreia===false?'<span class="chip new">decisión nueva</span>':''}</span></button>`;
  }).join('');
  const del = p.example ? '' : (S.confirmDel === p.id
    ? `<div class="card"><p><b>¿Borrar «${esc(p.name)}» y todas sus pruebas?</b> No se puede deshacer.</p><div class="row"><button class="danger" data-act="delete-yes">Sí, borrar</button><button data-act="delete-no">Cancelar</button></div></div>`
    : `<button class="ghost" data-act="delete-ask" style="color:var(--alert)">Borrar prototipo</button>`);
  const mecs = p.mecanicas.filter(m => (m.nombre||'').trim());
  return `<button class="ghost" data-act="home" style="align-self:flex-start">← Inicio</button>${modeBanner()}
  <div><div class="kick">Versión ${p.version}${p.lugar?' · '+esc(p.lugar):''}</div><h1>${esc(p.name)}</h1></div>
  ${cta}
  ${closed.length ? `<div class="card tight"><div class="row counts"><span><b>${closed.length}</b> ${closed.length===1?'prueba':'pruebas'}</span><span>·</span><span><b>${sus}</b> ${sus===1?'decisión sustentada':'decisiones sustentadas'}</span><span>·</span><span><b>${nuevas}</b> ${nuevas===1?'decisión nueva':'decisiones nuevas'}</span></div></div>` : ''}
  ${repHtml}
  ${mecs.length ? `<section class="card"><h2>Mecánicas</h2>${mecs.map((m,i)=>mecTree(m,i)).join('')}</section>` : ''}
  ${hist ? `<section class="stack"><h2>Historial</h2><div class="hist">${hist}</div></section>` : ''}
  ${p.example ? '' : `<div class="row"><button data-act="csv" ${closed.length?'':'disabled'}>Exportar datos (CSV)</button>${del}</div>`}`;
}

/* ---------- Definir mecánicas (P2 del diagrama) ----------
   Jerarquía visible: mecánica = tarjeta con medallón y código M; componente = fila con sangría, barra kraft,
   código C y ▽ para abrir; variable = dentro del componente abierto, más pequeña, con ◆ y código V. */
function vMecs(p){
  const list = p.mecanicas;
  const usados = new Set(list.map(m => m.sug).filter(Boolean));
  const incl = list.filter(m => m.incluir !== false && (m.nombre||'').trim());
  const nv = incl.reduce((a, m) => a + mecVars(m).length, 0);
  const errores = incl.flatMap(m => mecErrors(m));
  const cards = list.map((m, mi) => mecCard(p, m, mi)).join('');
  return `<button class="ghost" data-act="back-proto" style="align-self:flex-start">← ${esc(p.name)}</button>${modeBanner()}
  <div><div class="kick">Paso 1 de la prueba</div><h1>Definir mecánicas</h1></div>
  <div class="card tight"><label for="sug-sel">Mecánicas sugeridas</label>
    <select id="sug-sel" data-act-change="addsug"><option value="">Elige una para añadirla con sus componentes y variables…</option>${SUG.map(sg=>`<option value="${sg.k}" ${usados.has(sg.k)?'disabled':''}>${sg.n}${usados.has(sg.k)?' · ya está':''}</option>`).join('')}</select>
    <span class="hint">Trae componentes y variables de ejemplo: cámbialos o bórralos según tu juego.</span></div>
  ${cards ? `<div class="rejilla mecs-r">${cards}</div>` : '<p class="hint">Todavía no hay mecánicas. Elige una sugerida o crea una nueva.</p>'}
  <button class="con-ico" data-act="addmec">＋ Nueva mecánica</button>
  ${incl.length > LIM.mecAviso ? `<div class="banner warn"><b>Vas a probar ${incl.length} mecánicas.</b> Manejar más de 2 puede ser contraproducente: 2 mecánicas pueden derivar fácilmente en 7 variables, y cada una se marca con cada jugador.</div>` : ''}
  ${nv > LIM.varAviso ? `<div class="banner warn"><b>Tienes ${nv} variables.</b> Con 4 jugadores son ${nv*4} marcas por partida. Más de ${LIM.varAviso} suele ser demasiado para marcar mientras observas.</div>` : ''}
  ${incl.length ? `<p class="hint counts">${incl.length} ${incl.length===1?'mecánica':'mecánicas'} en la prueba · ${nv} ${nv===1?'variable':'variables'}${errores.length?` · <b style="color:var(--alert)">${errores.length} por completar</b>`:''}</p>` : ''}
  ${errores.length ? `<div class="banner warn"><b>Antes de probar:</b><ul>${[...new Set(errores)].slice(0,4).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
  <button class="primary full" data-act="probar" ${incl.length && nv && !errores.length && !p.example ? '' : 'disabled'}>Probar mecánicas</button>`;
}
function mecErrors(m){
  const e = []; const nm = (m.nombre||'').trim() || 'Mecánica sin nombre';
  if (!(m.nombre||'').trim()) e.push('Ponle nombre a cada mecánica.');
  const c = critCheck(m.intencion); if (c.err) e.push(`${nm}: ${c.err}`);
  if (!mecVars(m).length) e.push(`${nm}: añade al menos un componente con una variable.`);
  return e;
}
function mecCard(p, m, mi){
  const c = critCheck(m.intencion), on = m.incluir !== false;
  const comps = m.componentes.map((cp, ci) => compRow(m, mi, cp, ci)).join('');
  const sg = SUG.find(x => x.k === m.sug);
  const sugComps = sg ? sg.comps.filter(x => !m.componentes.some(cp => cp.nombre === x.n)) : [];
  return `<div class="card mec ${on?'':'off'}">
    <div class="mec-h">${ico(m.sug?'mec-'+m.sug:'mec-propia','ico-m')}<span class="cod m">M${mi+1}</span><span class="kick">Mecánica</span>
      <span class="row" style="margin-left:auto"><button class="chipbtn" data-act="incluir" data-m="${mi}" aria-pressed="${on}">${on?'En la prueba':'Fuera de la prueba'}</button><button class="ghost" data-act="delmec" data-m="${mi}" aria-label="Quitar mecánica">✕</button></span></div>
    <div class="field"><label for="mn-${m.id}">Nombre</label><input id="mn-${m.id}" type="text" data-bind="pm.${mi}.nombre" value="${esc(m.nombre)}" placeholder="Por ejemplo: tiempo de partida"></div>
    <div class="field"><label for="mi-${m.id}">Intención previa · lo que esperas que pase en la mesa</label>
      <textarea id="mi-${m.id}" data-bind="pm.${mi}.intencion" placeholder="Por ejemplo: la partida dura menos de 1 hora">${esc(m.intencion)}</textarea>
      <span class="hint">Concreta, no de libre interpretación: algo que se pueda ver en la mesa y en qué momento lo miras.</span>
      ${m.siguiente?`<span class="hint"><b>La vez pasada esperabas:</b> ${esc(m.siguiente)}</span>`:''}
      ${(m.intencion||'').trim() ? (c.err?`<span class="err">${c.err}</span>`:c.warn?`<span class="warnmsg">${c.warn}</span>`:'<span class="hint">Bien: se puede ver en la mesa.</span>') : ''}</div>
    <div class="nivel-t">Componentes</div>
    ${comps || '<p class="hint">Sin componentes todavía.</p>'}
    <div class="row">${sugComps.length?`<select class="mini" data-act-change="addcompsug" data-m="${mi}" aria-label="Componente sugerido"><option value="">Componente sugerido…</option>${sugComps.map(x=>`<option value="${esc(x.n)}">${esc(x.n)}</option>`).join('')}</select>`:''}<button class="chipbtn" data-act="addcomp" data-m="${mi}">＋ Componente</button></div>
  </div>`;
}
function compRow(m, mi, cp, ci){
  const open = cp.abierto !== false; const nv = cp.variables.filter(named).length;
  return `<div class="comp">
    <div class="comp-h"><button class="toggle" data-act="togglecomp" data-m="${mi}" data-c="${ci}" aria-expanded="${open}" aria-label="${open?'Cerrar':'Abrir'} variables">${open?'▼':'▶'}</button><span class="cod c">C${ci+1}</span>
      <input id="cn-${cp.id}" type="text" data-bind="pm.${mi}.componentes.${ci}.nombre" value="${esc(cp.nombre)}" placeholder="Componente: p. ej., combos" aria-label="Nombre del componente">
      <span class="small muted nowrap">${nv} var.</span><button class="ghost" data-act="delcomp" data-m="${mi}" data-c="${ci}" aria-label="Quitar componente">✕</button></div>
    ${open ? `<div class="vars">${cp.variables.map((v, vi) => varRow(m, mi, cp, ci, v, vi)).join('')}
      <button class="chipbtn" style="align-self:flex-start" data-act="addvar" data-m="${mi}" data-c="${ci}">＋ Variable</button></div>` : ''}
  </div>`;
}
function varRow(m, mi, cp, ci, v, vi){
  const base = `pm.${mi}.componentes.${ci}.variables.${vi}`; const propia = v.propia || (v.intencion||'').trim();
  return `<div class="var-r">
    <div class="row" style="flex-wrap:nowrap"><span class="cod v">◆ V${vi+1}</span><input id="vn-${v.id}" type="text" data-bind="${base}.nombre" value="${esc(v.nombre)}" placeholder="Variable: p. ej., cantidad de combos" aria-label="Nombre de la variable"><button class="ghost" data-act="delvar" data-m="${mi}" data-c="${ci}" data-v="${vi}" aria-label="Quitar variable">✕</button></div>
    ${propia ? `<div class="field"><label for="vi-${v.id}" class="small">Intención de esta variable <span class="hint">(si no, usa la de la mecánica)</span></label><input id="vi-${v.id}" type="text" data-bind="${base}.intencion" value="${esc(v.intencion)}" placeholder="${esc(v.ej?'Por ejemplo: '+v.ej:'Qué debe verse en la mesa')}"></div>`
      : `<button class="ghost small" style="align-self:flex-start" data-act="varint" data-m="${mi}" data-c="${ci}" data-v="${vi}">＋ intención propia</button>`}
  </div>`;
}

/* ---------- Prueba: antes de jugar → partida → opiniones → resultados → decisión ---------- */
function curSession(p){ return p.sessions.find(s => s.id === S.view.sid); }
function stepIndex(s){ return STEPS.findIndex(x => x[0] === s.estado); }
function vSession(p){
  const s = curSession(p); if (!s) return `<div class="banner warn">No encontré esa prueba.</div>`;
  if (s.estado === 'cerrada') return vSummary(p, s.id);
  const si = stepIndex(s);
  const stepper = `<div class="steps" aria-label="Pasos de la prueba">${STEPS.map((x,i)=>i<si?`<span class="done" role="button" tabindex="0" data-act="to-step" data-step="${x[0]}">${x[2]} · ${x[1]}</span>`:`<span class="${i===si?'on':''}">${x[2]} · ${x[1]}</span>`).join('')}</div>`;
  const views = {preparar:sPreparar, partida:sPartida, opiniones:sOpiniones, cruce:sCruce, decision:sDecision};
  const prev = si > 0 ? `<button class="ghost" data-act="to-step" data-step="${STEPS[si-1][0]}">← Anterior</button>` : `<button class="ghost" data-act="editmap">← Mecánicas</button>`;
  return `<button class="ghost" data-act="back-proto" style="align-self:flex-start">← ${esc(p.name)}</button>${modeBanner()}
  <div><div class="kick">Versión ${s.version} · prueba ${s.n}</div><h1>${STEPS[si][1]}</h1></div>${stepper}${views[s.estado](p,s)}<div>${prev}</div>`;
}
function sd(s){ if (!S.d.s || S.d.s.sid !== s.id) S.d.s = {sid:s.id, probar:(s.intencion||{}).probar||'', cambiar:(s.intencion||{}).cambiar||''}; return S.d.s; }

function sPreparar(p, s){
  const d = sd(s), nj = s.jugadores || 4;
  const ok = d.probar.trim() && d.cambiar.trim();
  return `<section class="card"><h2>Declaración general</h2>
    <p class="small">Qué quieres probar hoy y qué crees que vas a cambiar. Vuelve en los resultados para contrastar.</p>
    <div class="field"><label for="in-probar">¿Qué quieres probar hoy?</label><textarea id="in-probar" data-bind="s.probar" placeholder="Por ejemplo: si el puntaje premia la planeación">${esc(d.probar)}</textarea></div>
    <div class="field"><label for="in-cambiar">¿Qué crees que vas a cambiar?</label><textarea id="in-cambiar" data-bind="s.cambiar" placeholder="Por ejemplo: el valor de los combos">${esc(d.cambiar)}</textarea></div></section>
  <section class="card tight"><h3>Jugadores</h3>
    <div class="seg">${[2,3,4].map(n=>`<button data-act="nj" data-v="${n}" aria-pressed="${nj===n}">${n}</button>`).join('')}</div>
    <span class="hint">¿Juegas tú?</span><div class="seg"><button data-act="juega" data-v="1" aria-pressed="${s.juega===true}">Sí</button><button data-act="juega" data-v="0" aria-pressed="${s.juega===false}">No</button></div>
    ${s.juega?'<div class="banner warn"><b>Si juegas tú, es fácil marcar de memoria.</b> Marca en las pausas del juego o pide a otra persona que observe.</div>':''}</section>
  <section class="card"><h3>Al llegar, lee el permiso en voz alta</h3><p class="sealed">${esc(PERMISO)}</p>
    <ol><li>Quien no acepte no se marca.</li><li>J1 es quien está a tu izquierda; sigue en el sentido del reloj.</li></ol></section>
  <section class="card"><h3>¿Dónde vas a marcar?</h3>
    <button class="primary con-ico" data-act="start" data-modo="app" ${ok?'':'disabled'}>${ico('modo-digital','ico-b')}Empezar la partida en la app</button>
    <div class="row"><button class="con-ico" data-act="pdf-mesa">${ico('modo-pdf','ico-b')}Descargar hoja de mesa (PDF)</button><button class="con-ico" data-act="start" data-modo="papel" ${ok?'':'disabled'}>${ico('modo-papel','ico-b')}Marcar en papel</button></div>
    ${ok?'':'<p class="hint">Para empezar, escribe qué quieres probar y qué crees que vas a cambiar.</p>'}</section>`;
}

const SIMG = {ok:'positivo', falla:'negativo', na:'neutro'};
const simg = (v, cls) => `<img class="${cls||'sim'}" src="img/sim-${SIMG[v]}.png" alt="">`;
const ico = (name, cls) => `<img class="${cls||'ico'}" src="img/ico-${name}.png" alt="">`;
function cell(s, vid, kind, j){
  const m = ((s.marcas||{})[vid]||{})[kind] || {}; const v = m[j] || '';
  return `<button class="mk ${v}" data-act="mark" data-vid="${vid}" data-kind="${kind}" data-j="${j}" aria-label="${j}, ${kind==='hacen'?'hacen':'dicen'}: ${v?LAB[v]:'vacía'}">${v?simg(v):''}</button>`;
}
function photoCard(s){
  return `<div class="card tight"><h3>Foto de la hoja</h3><p class="hint">Queda como evidencia. Con la foto a la vista, pasa las marcas tocando cada casilla.</p>
    <label class="btn" for="ph-in">${S.photoUrl[s.id]||(s.fotos||[]).length?'Cambiar la foto':'Tomar o subir la foto'}</label><input id="ph-in" class="vh" type="file" accept="image/*" capture="environment" data-act-change="photo">
    ${fotoBox(s, 'Foto de la hoja de mesa')}
    ${S.photoStatus?`<span class="hint">${esc(S.photoStatus)}</span>`:''}</div>`;
}
/* P3 del diagrama: tabla M | C | variable | J1–J4 y, debajo, las anotaciones manuales. */
function sPartida(p, s){
  const nj = s.jugadores || 4, js = JS.slice(0, nj);
  let rows = '', lastM = '', lastC = '';
  s.vars.forEach(v => {
    const mOn = v.mcode !== lastM, cOn = mOn || v.ccode !== lastC; lastM = v.mcode; lastC = v.ccode;
    rows += `<tr class="${mOn?'m-start':cOn?'c-start':''}"><td class="tc">${mOn?`<span class="cod m" title="${esc(v.mec)}">${v.mcode}</span>`:''}${cOn?`<span class="cod c" title="${esc(v.comp)}">${v.ccode}</span>`:''}</td>
      <th scope="row"><span class="vlab" data-hold="${v.id}">${esc(v.nombre)}</span></th>${js.map(j => `<td class="cel">${cell(s, v.id, 'hacen', j)}</td>`).join('')}</tr>`;
  });
  const leyM = [...new Map(s.vars.map(v => [v.mcode, v.mec])).entries()].map(([c,n]) => `<span><b class="cod m">${c}</b> ${esc(n)}</span>`).join('');
  const leyC = [...new Map(s.vars.map(v => [v.mcode+v.ccode, [v.mcode, v.ccode, v.comp]])).values()].map(([mc,c,n]) => `<span><b class="cod c">${mc}·${c}</b> ${esc(n)}</span>`).join('');
  return `${s.modo==='papel'?`<div class="banner">Marcas en papel. Al terminar, toma la foto y pasa aquí las marcas.</div>${photoCard(s)}`:''}
    <div class="legend"><span>${simg('ok','sim-s')} positivo</span><span>${simg('falla','sim-s')} negativo</span><span>${simg('na','sim-s')} neutro</span><span>vacío: no se vio</span></div>
    <div class="partida-r"><div class="card tight tabla-card"><div class="tablawrap"><table class="tabla"><thead><tr><th>M·C</th><th>Variables</th>${js.map(j=>`<th>${j}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <span class="hint">Mantén presionada una variable para ver su intención previa.</span>
      <div class="claves">${leyM}${leyC}</div></div>
    <section class="card"><h3>Anotaciones manuales</h3>
      <div class="field"><label for="nota-g">Notas</label><textarea id="nota-g" data-bind="sess.nota" placeholder="Lo que no cabe en un símbolo. Puedes citar la variable (M1·C1·V2) y al jugador (J3).">${esc(s.nota||'')}</textarea></div></section></div>
    <button class="primary full" data-act="to-step" data-step="opiniones">Terminó la partida: opiniones</button>`;
}

function sOpiniones(p, s){
  const nj = s.jugadores || 4, js = JS.slice(0, nj); s.opiniones = s.opiniones || {};
  const cards = s.vars.map(v => `<div class="card"><div class="kick">${v.mcode}·${v.ccode} · ${esc(v.mec)} › ${esc(v.comp)}</div><h3 class="vlab d" data-hold="${v.id}">${esc(v.nombre)}</h3>
    <div class="qbox"><p>${esc(question(v))}</p></div>
    ${js.map(j => `<div class="oprow"><span class="jh">${j}</span>${cell(s, v.id, 'dicen', j)}<input id="op-${v.id}-${j}" type="text" data-bind="op.${v.id}.${j}" value="${esc((s.opiniones[v.id]||{})[j]||'')}" placeholder="Lo que dijo, entre comillas" aria-label="Opinión de ${j} sobre ${esc(v.nombre)}"></div>`).join('')}</div>`).join('');
  const sorps = (p.sorpresas||[]).filter(x => !x.convertida); s.repetidas = s.repetidas || [];
  return `<section class="stack"><p>A cada jugador, por turnos. Pregunta por momentos concretos, no por opiniones. Marca cómo lo cuenta y, si vale la pena, anota sus palabras. Cierre: 10 minutos o menos.</p>
    <div class="banner warn">Evita «¿Te gustó?», «¿Verdad que fue divertido?» o «¿Qué cambiarías?»: dan respuestas amables, no información.</div>
    <div class="rejilla">${cards}</div>
    <div class="card tight"><label for="ph-sorp">¿Qué se repitió o te sorprendió? <span class="hint">(una línea)</span></label><input id="ph-sorp" type="text" data-bind="sess.sorpresa" value="${esc(s.sorpresa||'')}" placeholder="Por ejemplo: todos negocian semillas">
      ${sorps.length?`<span class="hint">¿Volvió a pasar algo de esto?</span>${sorps.map(x=>`<button class="opt" data-act="rep" data-id="${x.id}" aria-pressed="${s.repetidas.includes(x.id)}"><span class="tick">${s.repetidas.includes(x.id)?'✓':''}</span><span>«${esc(x.texto)}»</span></button>`).join('')}`:''}</div>
    <button class="primary" data-act="to-step" data-step="cruce">Ver resultados</button></section>`;
}

function varResult(s, v){
  const r = cruce((s.marcas||{})[v.id]||{}, s.jugadores);
  const hLine = `<b>${r.h.ok.length}</b> positivo · <b>${r.h.falla.length}</b> negativo · <b>${r.h.na.length}</b> neutro${r.h.vacio.length?` · ${r.h.vacio.length} no se vio`:''} <span class="hint">(de ${r.total})</span>`;
  const dLine = `<b>${r.d.ok.length}</b> positivo · <b>${r.d.falla.length}</b> negativo · <b>${r.d.na.length}</b> neutro${r.d.vacio.length?` · ${r.d.vacio.length} no lo mencionó`:''}`;
  const cases = CASES4.filter(k => r.cases[k].length).map(k => `<div class="case ${k===r.main&&r.firme?'strong':''}"><b>${CASE_TXT[k][0]}</b> · ${r.cases[k].length} ${r.cases[k].length===1?'jugador':'jugadores'}<br><span class="small">${CASE_TXT[k][1]}${r.cases[k].length<2?' Un solo jugador.':''}</span></div>`).join('');
  const head = r.main ? `${CASE_TXT[r.main][0]}${r.firme?'':' (señal débil)'}` : 'Sin datos para cruzar';
  const why = r.main && (r.main === 'falla_mesa' || r.main === 'funciona_mesa') ? `<p class="small">${CASE_TXT[r.main][1]}</p>` : (!r.firme && r.main ? '<p class="small">Ningún resultado se repite en 2 jugadores o más. Puedes decidir, pero conviene volver a observar.</p>' : '');
  const ops = Object.entries((s.opiniones||{})[v.id]||{}).filter(([,t]) => (t||'').trim());
  return {r, html:`<div class="card res"><div class="kick">${v.mcode}·${v.ccode} · ${esc(v.mec)} › ${esc(v.comp)}</div><h3>${esc(v.nombre)} · ${head}</h3>
    <div class="sealed small"><b>Intención previa:</b> ${esc(v.intencion)}${v.valor?`<br><span class="muted">Valor actual: ${esc(v.valor)}</span>`:''}</div>
    <div class="line2"><span class="tag h">Hacen</span><span>${hLine}</span></div>
    <div class="line2"><span class="tag d">Dicen</span><span>${dLine}</span></div>
    ${why}${cases || '<p class="hint">No hay jugadores con marca positiva o negativa en lo que hicieron y en lo que dijeron a la vez. Sin las dos, no se puede cruzar.</p>'}
    ${ops.length?`<div class="stack"><span class="kick">Lo que dijeron</span><ul class="oplist">${ops.map(([j,t])=>`<li><b>${j}</b> «${esc(t)}»</li>`).join('')}</ul></div>`:''}</div>`};
}
function sCruce(p, s){
  const res = s.vars.map(v => varResult(s, v));
  const fallan = res.filter(x => x.r.falla).length;
  return `<section class="stack">
    <div class="sealed"><div class="kick">Lo que declaraste antes de jugar</div><p><b>Querías probar:</b> ${esc(s.intencion.probar)}</p><p><b>Creías que cambiarías:</b> ${esc(s.intencion.cambiar)}</p></div>
    ${(s.nota||'').trim()?`<div class="card tight"><span class="kick">Tus anotaciones de la partida</span><p class="small" style="white-space:pre-wrap">${esc(s.nota)}</p></div>`:''}
    <div class="rejilla">${res.map(x=>x.html).join('')}</div>
    ${fallan >= 2 ? `<div class="banner warn"><b>${fallan} variables salen negativas con señal firme. ¿Una puede estar causando otra?</b> Si cambias varias a la vez, no sabrás cuál produjo el efecto.</div>` : ''}
    <p class="hint">La app no te dice qué cambiar. Muestra lo que pasó; la decisión es tuya.</p>
    <button class="primary" data-act="to-step" data-step="decision">Decidir</button></section>`;
}
function sDecision(p, s){
  s.decisiones = s.decisiones || {};
  const blocks = s.vars.map(v => {
    const i = v.id, dec = s.decisiones[i] = s.decisiones[i] || {verbo:'', nuevoValor:'', espera:'', porque:''};
    const r = cruce((s.marcas||{})[i]||{}, s.jugadores);
    return `<div class="card"><div class="kick">${v.mcode}·${v.ccode} · ${esc(v.mec)} › ${esc(v.comp)}</div><h3>${esc(v.nombre)} · ${r.main?CASE_TXT[r.main][0]+(r.firme?'':' (señal débil)'):'Sin datos para cruzar'}</h3>
      <div class="verbs">${VERBS.map(w=>`<button class="${w.wide?'wide':''}" data-act="verbo" data-vid="${i}" data-w="${w.k}" aria-pressed="${dec.verbo===w.k}">${ico('dec-'+w.k,'ico-v')}<span class="vtx"><b>${w.n}</b><span class="small">${w.d}</span></span></button>`).join('')}</div>
      ${dec.verbo==='ajustar'||dec.verbo==='potenciar'?`<div class="field"><label for="de-nv-${i}">${dec.verbo==='ajustar'?'Nuevo valor':'¿Cómo le das más espacio?'}</label><input id="de-nv-${i}" type="text" data-bind="dec.${i}.nuevoValor" value="${esc(dec.nuevoValor)}"></div>
        <div class="field"><label for="de-es-${i}">Nuevo resultado esperado <span class="hint">(será la intención previa la próxima vez)</span></label><input id="de-es-${i}" type="text" data-bind="dec.${i}.espera" value="${esc(dec.espera)}"></div>`:''}
      ${dec.verbo?`<div class="field"><label for="de-pq-${i}">¿Por qué? <span class="hint">(opcional)</span></label><input id="de-pq-${i}" type="text" data-bind="dec.${i}.porque" value="${esc(dec.porque)}"></div>`:''}
      ${dec.verbo&&dec.verbo!=='observar'&&!r.firme?'<span class="warnmsg">Esta decisión no tiene una señal firme detrás (2 jugadores o más). Puedes tomarla, pero queda como no sustentada.</span>':''}</div>`;
  }).join('');
  const changes = s.vars.filter(v => { const w = VERBS.find(x => x.k === (s.decisiones[v.id]||{}).verbo); return w && w.change; }).length;
  const allDecided = s.vars.every(v => { const d = s.decisiones[v.id]; return d && d.verbo && ((d.verbo!=='ajustar' && d.verbo!=='potenciar') || (d.nuevoValor.trim() && d.espera.trim())); });
  return `<section class="stack"><div class="rejilla">${blocks}</div>
    ${changes > 1 ? `<div class="banner warn"><b>Vas a cambiar ${changes} cosas a la vez.</b> En la próxima prueba no sabrás cuál produjo el efecto.</div>` : ''}
    <div class="card"><div class="sealed"><p><b>Creías que cambiarías:</b> ${esc(s.intencion.cambiar)}</p></div>
      <span class="hint">¿Es lo que creías que ibas a cambiar?</span>
      <div class="seg"><button data-act="era" data-v="1" aria-pressed="${s.eraLoQueCreia===true}">Sí</button><button data-act="era" data-v="0" aria-pressed="${s.eraLoQueCreia===false}">No: es una decisión nueva</button></div></div>
    <button class="primary" data-act="close" ${allDecided && s.eraLoQueCreia!=null?'':'disabled'}>Guardar decisiones</button>
    ${allDecided?'':'<p class="hint">Falta decidir alguna variable. Ajustar y potenciar piden nuevo valor y nuevo resultado esperado.</p>'}</section>`;
}

/* ---------- Resumen de una prueba cerrada ---------- */
function vSummary(p, sid){
  const s = p.sessions.find(x => x.id === sid); if (!s) return '';
  const res = (s.vars||[]).map(v => {
    const pr = varResult(s, v); const d = (s.decisiones||{})[v.id]||{}; const w = VERBS.find(x=>x.k===d.verbo);
    return pr.html + `<div class="card tight"><span class="kick">Decisión · ${esc(v.nombre)}</span><p><b>${w?w.n:'Sin decidir'}</b>${d.nuevoValor?` · ${esc(d.nuevoValor)}`:''} ${sustentada(s,v.id)?'<span class="chip sus">sustentada</span>':''}</p>${d.espera?`<p class="small">Nuevo resultado esperado: ${esc(d.espera)}</p>`:''}${d.porque?`<p class="small muted">Por qué: ${esc(d.porque)}</p>`:''}</div>`;
  }).join('');
  return `<button class="ghost" data-act="back-proto" style="align-self:flex-start">← ${esc(p.name)}</button>
  <div><div class="kick">Versión ${s.version} · ${fdate(s.fecha)}${s.jugadores?' · '+s.jugadores+' jugadores':''}</div><h1>Prueba ${s.n}</h1></div>
  <div class="sealed"><p><b>Querías probar:</b> ${esc((s.intencion||{}).probar)}</p><p><b>Creías que cambiarías:</b> ${esc((s.intencion||{}).cambiar)}</p>${s.eraLoQueCreia===false?'<p><span class="chip new">decisión nueva</span></p>':''}</div>
  ${fotoBox(s, 'Foto de la hoja de mesa')}
  ${(s.nota||'').trim()?`<div class="card tight"><span class="kick">Anotaciones de la partida</span><p class="small" style="white-space:pre-wrap">${esc(s.nota)}</p></div>`:''}
  ${res}${s.sorpresa?`<div class="card tight"><span class="kick">Lo que te sorprendió</span><p>${esc(s.sorpresa)}</p></div>`:''}`;
}

/* ---------------- Acciones ---------------- */
function curProto(){ return getProto(S.view.pid); }
function M(el){ return curProto().mecanicas[Number(el.dataset.m)]; }
function save(){ persist(curProto()); render(); }
function snapshot(p){
  const out = [];
  p.mecanicas.filter(m => m.incluir !== false && (m.nombre||'').trim()).forEach((m) => {
    const mi = p.mecanicas.indexOf(m);
    m.componentes.forEach((c, ci) => c.variables.forEach(v => { if (!named(v)) return;
      out.push({id:v.id, mcode:'M'+(mi+1), ccode:'C'+(ci+1), mec:m.nombre.trim(), comp:(c.nombre||'').trim() || 'General', nombre:v.nombre.trim(), valor:(v.valor||'').trim(), mint:(m.intencion||'').trim(), intencion:((v.intencion||'').trim() || (m.intencion||'').trim())}); }));
  });
  return out;
}
const ACTIONS = {
  home(){ go({name:'home'}); },
  instructivo(){ go({name:'instructivo'}); },
  open(el){ const p = getProto(el.dataset.pid); go(p && !p.example && !hasMap(p) ? {name:'mecs', pid:el.dataset.pid} : {name:'proto', pid: el.dataset.pid}); },
  'back-proto'(){ go({name:'proto', pid:S.view.pid}); },
  create(){
    const d = S.d.home; if (!d.name.trim()) return;
    const p = emptyProto(d.name.trim(), d.lugar.trim()); S.d.home = {name:'', lugar:''};
    persist(p); go({name:'mecs', pid:p.id});
  },
  editmap(){ go({name:'mecs', pid:S.view.pid}); },
  addmec(){ const p = curProto(); const m = newMec(''); m.componentes = [newComp('')]; p.mecanicas.push(m); save(); },
  delmec(el){ curProto().mecanicas.splice(Number(el.dataset.m), 1); save(); },
  incluir(el){ const m = M(el); m.incluir = m.incluir === false; save(); },
  addcomp(el){ const m = M(el); if (m.componentes.length >= LIM.comps) { toast(`Máximo ${LIM.comps} componentes por mecánica.`); return; } m.componentes.push(newComp('')); save(); },
  delcomp(el){ M(el).componentes.splice(Number(el.dataset.c), 1); save(); },
  togglecomp(el){ const c = M(el).componentes[Number(el.dataset.c)]; c.abierto = c.abierto === false; save(); },
  addvar(el){ const c = M(el).componentes[Number(el.dataset.c)]; if (c.variables.length >= LIM.vars) { toast(`Máximo ${LIM.vars} variables por componente.`); return; } c.variables.push(newVar()); save(); },
  delvar(el){ M(el).componentes[Number(el.dataset.c)].variables.splice(Number(el.dataset.v), 1); save(); },
  varint(el){ const v = M(el).componentes[Number(el.dataset.c)].variables[Number(el.dataset.v)]; v.propia = true; save(); const t = document.getElementById('vi-'+v.id); if (t) t.focus(); },
  probar(){
    const p = curProto(); const vars = snapshot(p); if (!vars.length) return;
    let s = openSession(p);
    if (!s) { s = {id:uid('s'), tipo:'prueba', version:p.version, n: pruebas(p).length + 1, fecha:now(), estado:'preparar', vars, marcas:{}, nota:'', opiniones:{}, decisiones:{}, fotos:[], jugadores:4, juega:null, intencion:{probar:'', cambiar:''}}; p.sessions.push(s); }
    else { s.vars = vars; }
    persist(p); S.d.s = null; go({name:'session', pid:p.id, sid:s.id});
  },
  resume(el){ go({name:'session', pid:S.view.pid, sid:el.dataset.sid}); },
  summary(el){ go({name:'summary', pid:S.view.pid, sid:el.dataset.sid}); },
  start(el){ const p = curProto(), s = curSession(p), d = sd(s); s.intencion = {probar:d.probar.trim(), cambiar:d.cambiar.trim()}; s.modo = el.dataset.modo; s.estado = 'partida'; persist(p); render(); toTop(); },
  'to-step'(el){ const p = curProto(), s = curSession(p); if (s.estado === 'preparar') { const d = sd(s); s.intencion = {probar:d.probar.trim(), cambiar:d.cambiar.trim()}; } s.estado = el.dataset.step; persist(p); render(); toTop(); },
  nj(el){ const p = curProto(), s = curSession(p); s.jugadores = Number(el.dataset.v); persist(p); render(); },
  juega(el){ const p = curProto(), s = curSession(p); s.juega = el.dataset.v === '1'; persist(p); render(); },
  mark(el){
    const p = curProto(), s = curSession(p), i = el.dataset.vid, k = el.dataset.kind, j = el.dataset.j;
    s.marcas[i] = s.marcas[i] || {hacen:{}, dicen:{}}; s.marcas[i][k] = s.marcas[i][k] || {};
    const nv = NEXT[s.marcas[i][k][j] || '']; if (nv) s.marcas[i][k][j] = nv; else delete s.marcas[i][k][j];
    persist(p); render();
  },

    if (n) { font(doc,'bold',8.6); doc.text(n, x+2, y+rh/2); font(doc,'normal',6.2,[110,110,110]); doc.text(wrap(doc, h, cw[0]-4, 1), x+2, y+rh/2+3.4); }
    else { D(doc,[140,140,140]); doc.line(x+2, y+rh/2+0.5, x+cw[0]-3, y+rh/2+0.5); font(doc,'normal',6.2,[120,120,120]); doc.text(h, x+2, y+rh/2+3.6); }
    sbox(doc, x+w-cw[cw.length-1]/2-2.5, y+rh/2-2.5, 5, 5); y += rh;
  });
  D(doc, PC.line); doc.roundedRect(x, oy+30, w, H, 1.2, 1.2, 'S');
  let cx2 = x; cw.slice(0,-1).forEach(c => { cx2 += c; doc.line(cx2, oy+30, cx2, oy+30+H); });
}

/* ---------------- Arranque ---------------- */
/* Guardar un archivo: la app lo entrega al navegador, que lo pasa a Descargas. */
S.downloads = { save: ({filename, data}) => {
  const tipo = /\.pdf$/i.test(filename) ? 'application/pdf' : /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : 'application/octet-stream';
  const blob = new Blob([data], {type: tipo});
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 10000);
  return Promise.resolve();
} };
S.assets = { upload: async (file) => {
  const id = uid('f'); await fotoPut(id, file);
  if (S.blobUrl[id]) URL.revokeObjectURL(S.blobUrl[id]);
  S.blobUrl[id] = URL.createObjectURL(file); return {id};
} };

let instalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instalar = e; S.instalable = true; render(); });
window.addEventListener('appinstalled', () => { instalar = null; S.instalable = false; render(); });
ACTIONS.instalar = async () => {
  if (!instalar) return;
  const e = instalar; instalar = null; S.instalable = false; render();
  try { await e.prompt(); } catch(err) {}
};

function boot(){
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(CLAVE) === 0) keys.push(k); }
    keys.forEach(k => {
      try { const d = JSON.parse(localStorage.getItem(k)); if (d && d.schema === 2) { d.id = k.slice(CLAVE.length); S.protos[d.id] = d; } }
      catch(e) {}
    });
    localStorage.setItem(CLAVE + '_t', '1'); localStorage.removeItem(CLAVE + '_t');
    S.mode = 'db';
  } catch(e) { S.mode = 'memoria'; }
  S.ready = true; render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
